plugins {
    id 'java'
    id 'application'
}

version = '0.0.1'
group = 'com.example'

repositories {
    mavenCentral()
}

dependencies {
    // Для улучшенной графики можно добавить JOGL или LWJGL, но для простоты используем только Java2D
}

application {
    mainClass = 'Foxen3D'
}

// Указываем версию Java здесь
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Или альтернативный способ для старых версий Gradle:
// sourceCompatibility = 11
// targetCompatibility = 11

jar {
    manifest {
        attributes(
            'Main-Class': 'Foxen3D'
        )
    }
}
